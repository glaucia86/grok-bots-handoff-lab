name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all scripts
        run: python -m compileall -q scripts
      - name: Offline test (no API key)
        env:
          OPENAI_API_KEY: ""
          MEM0_API_KEY: ""
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests/ folder yet, skipping."
          fi

  links:
    name: Links in Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # These exact account/profile pages return 403/429 to the unauthenticated CI checker.
          # Keep all repository files, assets, fragments, and other external links checked.
          args: --no-progress --include-fragments --exclude '^https://platform\.openai\.com/(api-keys)?$' --exclude '^https://x\.com/glaucia_lemos86/?$' --exclude '^https://www\.instagram\.com/glaucia\.lemos\.dev/?$' './**/*.md'
          fail: true

