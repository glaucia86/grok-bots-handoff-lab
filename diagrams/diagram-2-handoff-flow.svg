 height="96" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="160.0" y="93.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Conversa marcada em</text><text x="160.0" y="113.25" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >blocos com ID</text><text x="160.0" y="132.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >(B01, B02...)</text><rect x="340" y="60" width="240" height="96" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><text x="460.0" y="93.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Agente gera nota de</text><text x="460.0" y="113.25" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >estado + registro (cada</text><text x="460.0" y="132.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >item cita fonte: B07,B08)</text><rect x="640" y="60" width="240" height="96" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><text x="760.0" y="103.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Mem0</text><text x="760.0" y="123.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >(infer: false)</text><rect x="940" y="60" width="240" height="96" rx="12" fill="#e9ecef" stroke="#868e96" stroke-dasharray="8 5" stroke-width="2"/><text x="1060.0" y="103.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >exportar_mem0.py</text><text x="1060.0" y="123.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >(opcional)</text><rect x="1240" y="60" width="240" height="96" rx="12" fill="#e9ecef" stroke="#868e96" stroke-dasharray="8 5" stroke-width="2"/><text x="1360.0" y="93.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Obsidian (grafo e</text><text x="1360.0" y="113.25" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >backlinks, só para</text><text x="1360.0" y="132.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >você ver)</text><rect x="40" y="220" width="240" height="80" rx="12" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/><text x="160.0" y="255.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Arquivo local:</text><text x="160.0" y="275.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >blocos-AAAA-MM-DD.md</text><rect x="40" y="420" width="240" height="96" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="160.0" y="463.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Nota de estado</text><text x="160.0" y="483.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >entra inteira</text><rect x="340" y="420" width="240" height="96" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/><text x="460.0" y="463.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Pergunta que a</text><text x="460.0" y="483.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >nota não responde</text><rect x="640" y="420" width="240" height="96" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/><text x="760.0" y="463.5" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Busca no registro</text><text x="760.0" y="483.0" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >(5 itens)</text><rect x="940" y="420" width="240" height="96" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="1060.0" y="453.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Se precisar do detalhe:</text><text x="1060.0" y="473.25" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >grep dos blocos pelos</text><text x="1060.0" y="492.75" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >IDs (até 3 blocos)</text><rect x="1240" y="420" width="240" height="96" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/><text x="1360.0" y="473.25" text-anchor="middle" font-family="DejaVu Sans" font-size="15.0" >Respo